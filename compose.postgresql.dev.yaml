# Opt-in local app integration. Combine with compose.dev.yaml and
# compose.postgresql.yaml; the regular SQLite development stack is unchanged.
name: ${RJ_DEV_PROJECT_NAME:-real-jaen-analytics-postgresql-dev}

services:
  sports-data:
    image: local/real-jaen-analytics/sports-data:${RJ_DEV_IMAGE_TAG:-postgresql-dev}
    entrypoint: !override [python, -B]
    command: !override [-m, uvicorn, app:app, --host, 0.0.0.0, --port, "8002", --workers, "1"]
    group_add: ["${RJ_APP_SECRET_GID:?Set the private GID printed by prepare-postgresql-app-secrets.sh}"]
    environment:
      SPORTS_DATA_STORAGE: postgresql
      SPORTS_DATA_DB: !reset null
      SPORTS_DATA_DATABASE_URL_FILE: /run/secrets/sports_data_database_url
      SPORTS_DATA_WORKDIR: /state
      SPORTS_DATA_CONTROL: "1"
      SPORTS_DATA_ENRICHMENT_ENABLED: "1"
      SPORTS_DATA_WORKERS: "1"
      WEB_CONCURRENCY: "1"
      POSTGRES_ALLOW_PRIVATE_DOCKER_NO_TLS: "1"
      POSTGRES_PRIVATE_DOCKER_HOSTS: postgresql
    volumes: !override
      - type: volume
        source: sports-operational-state
        target: /state
      - type: bind
        source: ${RJ_DEV_IMPORT_DIR:?Set RJ_DEV_IMPORT_DIR to the separate import directory}
        target: /imports
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/control-token
        target: /run/secrets/control-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/acquisition-token
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
    secrets: !override [sports_data_database_url]
    networks: !override [sports-data-internal, acquisition-control, postgresql-private]

  acquisition:
    image: local/real-jaen-analytics/acquisition:${RJ_DEV_IMAGE_TAG:-postgresql-dev}
    group_add: ["${RJ_APP_SECRET_GID:?Set the private GID printed by prepare-postgresql-app-secrets.sh}"]

  video-service:
    image: local/real-jaen-analytics/video-service:${RJ_DEV_IMAGE_TAG:-postgresql-dev}
    entrypoint: !override [python, -B, -m, video_service]
    command: !override []
    group_add: ["${RJ_APP_SECRET_GID:?Set the private GID printed by prepare-postgresql-app-secrets.sh}"]
    environment:
      VIDEO_SERVICE_STORAGE: postgresql
      VIDEO_SERVICE_DATABASE_URL_FILE: /run/secrets/video_service_database_url
      VIDEO_SERVICE_DATA_DIR: !reset null
      VIDEO_SERVICE_MANIFEST: !reset null
      VIDEO_SERVICE_STATE_DIR: /state
      POSTGRES_ALLOW_PRIVATE_DOCKER_NO_TLS: "1"
      POSTGRES_PRIVATE_DOCKER_HOSTS: postgresql
    volumes: !override
      - type: volume
        source: video-operational-state
        target: /state
    secrets: !override [video_service_database_url]
    networks: !override [video-internal, video-egress, postgresql-private]

  dashboard:
    image: local/real-jaen-analytics/dashboard:${RJ_DEV_IMAGE_TAG:-postgresql-dev}

networks:
  postgresql-private:
    name: ${PG_NETWORK_NAME:?Set PG_NETWORK_NAME in the external profile env file}
    internal: true

volumes:
  sports-operational-state:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-sports-operational-state
  video-operational-state:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-video-operational-state

secrets:
  sports_data_database_url:
    file: ${PG_SECRET_DIR:?Set PG_SECRET_DIR outside the repository}/sports_data_database_url
  video_service_database_url:
    file: ${PG_SECRET_DIR:?Set PG_SECRET_DIR outside the repository}/video_service_database_url
