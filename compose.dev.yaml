name: ${RJ_DEV_PROJECT_NAME:-real-jaen-analytics-dev}

services:
  sports-data:
    build:
      context: ./sports-data
      dockerfile: Dockerfile
    image: local/real-jaen-analytics/sports-data:dev
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700
    entrypoint: ["python", "-B", "-c"]
    command:
      - |
        import os, pathlib, shutil, sqlite3, sys
        state = pathlib.Path('/state')
        database = state / 'real-jaen.sqlite'
        seed = pathlib.Path('/run/rja-seed')
        def verify(path):
            connection = sqlite3.connect(f'file:{path}?mode=ro', uri=True)
            try:
                if connection.execute('PRAGMA integrity_check').fetchone()[0] != 'ok':
                    raise RuntimeError('La base deportiva de desarrollo no supera integrity_check.')
            finally:
                connection.close()
        if database.is_file():
            verify(database)
        elif any(path.is_file() or path.is_symlink() for path in state.rglob('*')):
            raise RuntimeError('El volumen deportivo no está vacío y no contiene real-jaen.sqlite; se rechaza sembrarlo.')
        else:
            if not (seed / 'real-jaen.sqlite').is_file():
                raise RuntimeError('Falta el paquete privado de datos deportivos en .rja-private/seed/sports.')
            shutil.copytree(seed, state, dirs_exist_ok=True)
            verify(database)
        os.execv(sys.executable, [sys.executable, '-B', '-m', 'uvicorn', 'app:app', '--host', '0.0.0.0', '--port', '8002'])
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 3
    environment:
      SPORTS_DATA_STORAGE: sql
      SPORTS_DATA_DB: /state/real-jaen.sqlite
      SPORTS_DATA_SCOPE: /app/ambito.json
      SPORTS_DATA_CONTROL: "1"
      SPORTS_DATA_ENRICHMENT_ENABLED: "1"
      SPORTS_DATA_WORKERS: "1"
      WEB_CONCURRENCY: "1"
      RJ_UPDATE_RECIPE: sofascore-group2-2627-v1
      RJ_ACQUISITION_URL: http://acquisition:8002
      RJ_ACQUISITION_SECRET_FILE: /run/secrets/acquisition-token
      RJ_CONTROL_SECRET_FILE: /run/secrets/control-token
      RJ_ACQUISITION_MAX_ATTEMPTS: "48"
      RJ_ACQUISITION_MAX_SENDS: "52"
      RJ_UPDATE_RECENT_ROUNDS: "3"
      RJ_UPDATE_MAX_TOTAL_SENDS: "50"
    volumes:
      - type: volume
        source: sports-state
        target: /state
      - type: bind
        source: ${RJ_DEV_SEED_DIR:-./.rja-private/seed}/sports
        target: /run/rja-seed
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_IMPORT_DIR:?Set RJ_DEV_IMPORT_DIR to a separate copy of import files}
        target: /imports
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/control-token
        target: /run/secrets/control-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/acquisition-token
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
    networks: [sports-data-internal, acquisition-control]
  acquisition:
    build:
      context: ./acquisition
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        implementation: ./acquisition/src/acquisition
        backend: ./sports-data
        checks: ./acquisition/tests
    image: local/real-jaen-analytics/acquisition:dev
    init: true
    restart: unless-stopped
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./acquisition/docker/seccomp-linux-amd64.json
    shm_size: 512m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    entrypoint: ["python", "-B", "-c"]
    command:
      - |
        import os, pathlib, sys
        profile_root = pathlib.Path('/profiles')
        if not any(profile_root.iterdir()):
            from acquisition.profile import Profile
            with Profile(profile_root) as owner:
                owner.initialize(confirm_new=True)
        os.execv(sys.executable, [sys.executable, '-B', '-m', 'uvicorn', 'acquisition.app:app', '--host', '0.0.0.0', '--port', '8002', '--workers', '1', '--no-access-log', '--reload', '--reload-dir', '/opt/app/acquisition'])
    environment:
      ACQ_PROVIDER: sofascore
      ACQ_ENABLE_REAL: ${RJ_ACQUISITION_ENABLE_REAL:-0}
      ACQ_MAX_ATTEMPTS: "48"
      ACQ_MAX_SENDS: "52"
      ACQ_UPDATE_RECENT_ROUNDS: "3"
      ACQ_UPDATE_MAX_TOTAL_SENDS: "50"
      ACQ_SECRET_FILE: /run/secrets/acquisition-token
    volumes:
      - type: volume
        source: acquisition-profiles
        target: /profiles
      - type: volume
        source: acquisition-jobs
        target: /acquisition-jobs
      - type: bind
        source: ./acquisition/src/acquisition
        target: /opt/app/acquisition
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./sports-data/acquisition
        target: /sports-data/acquisition
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./sports-data/acquisition
        target: /opt/shared-backend/acquisition
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/acquisition-token
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
    networks: [acquisition-control, acquisition-egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    image: local/real-jaen-analytics/video-service:dev
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    entrypoint: ["python", "-B", "-c"]
    command:
      - |
        import os, pathlib, shutil, sqlite3, sys
        state = pathlib.Path('/state')
        database = state / 'video-service.sqlite'
        seed = pathlib.Path('/run/rja-seed')
        def verify(path):
            connection = sqlite3.connect(f'file:{path}?mode=ro', uri=True)
            try:
                if connection.execute('PRAGMA integrity_check').fetchone()[0] != 'ok':
                    raise RuntimeError('La base persistente de vídeo no supera integrity_check.')
            finally:
                connection.close()
        if database.is_file():
            verify(database)
        elif any(path.is_file() or path.is_symlink() for path in state.rglob('*')):
            raise RuntimeError('El volumen de vídeo no está vacío y no contiene video-service.sqlite; se rechaza sembrarlo.')
        else:
            if not (seed / 'video-service.sqlite').is_file():
                raise RuntimeError('Falta el paquete privado del estado de vídeo en .rja-private/seed/video.')
            shutil.copytree(seed, state, dirs_exist_ok=True)
            verify(database)
        os.execv(sys.executable, [sys.executable, '-B', '-m', 'uvicorn', 'video_service.main:app', '--host', '0.0.0.0', '--port', '8010', '--reload', '--reload-dir', '/app/src'])
    environment:
      VIDEO_SERVICE_HOST: 0.0.0.0
      VIDEO_SERVICE_PORT: "8010"
      VIDEO_SERVICE_DATA_DIR: /app/data
      VIDEO_SERVICE_MANIFEST: ${RJ_DEV_VIDEO_MANIFEST:-videos.json}
      VIDEO_SERVICE_STATE_DIR: /state
      VIDEO_SERVICE_TEMP_DIR: /tmp/video-service
      TMPDIR: /tmp/video-service
      DENO_DIR: /tmp/video-service/deno
    volumes:
      - type: volume
        source: video-state
        target: /state
      - type: bind
        source: ${RJ_DEV_SEED_DIR:-./.rja-private/seed}/video
        target: /run/rja-seed
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_VIDEO_CATALOG_DIR:?Set RJ_DEV_VIDEO_CATALOG_DIR outside this repository}
        target: /app/data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./video-service/src
        target: /app/src
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp/video-service:rw,noexec,nosuid,size=4g,uid=10001,gid=10001,mode=0700
    networks: [video-internal, video-egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    image: local/real-jaen-analytics/dashboard:dev
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      DATA_MODE: real
      LOCAL_DATA_API_URL: http://sports-data:8002
      VIDEO_SERVICE_URL: http://video-service:8010
      RJ_ACCESS_PASSWORD_FILE: /run/secrets/access-password
      RJ_UPDATE_PASSWORD_FILE: /run/secrets/update-password
      RJ_SESSION_SECRET_FILE: /run/secrets/session/session-secret
      RJ_CONTROL_SECRET_FILE: /run/secrets/control-token
    volumes:
      - type: bind
        source: ./dashboard/src
        target: /app/src
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./dashboard/public
        target: /app/public
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./dashboard/data/synthetic
        target: /app/data/synthetic
        read_only: true
        bind: {create_host_path: false}
      - type: volume
        source: dashboard-next
        target: /app/.next
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/access-password
        target: /run/secrets/access-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/update-password
        target: /run/secrets/update-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/session
        target: /run/secrets/session
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/control-token
        target: /run/secrets/control-token
        read_only: true
        bind: {create_host_path: false}
    ports:
      - "127.0.0.1:${RJ_DEV_DASHBOARD_PORT:-33201}:3000"
    networks: [dashboard-edge, sports-data-internal, video-internal]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/session').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      sports-data:
        condition: service_healthy
      video-service:
        condition: service_healthy

networks:
  dashboard-edge:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-dashboard-edge
  sports-data-internal:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-sports-data-internal
    internal: true
  video-internal:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-video-internal
    internal: true
  acquisition-control:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-acquisition-control
    internal: true
  acquisition-egress:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-acquisition-egress
  video-egress:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-video-egress

volumes:
  sports-state:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-sports-state
  acquisition-profiles:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-acquisition-profiles
  acquisition-jobs:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-acquisition-jobs
  video-state:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-video-state
  dashboard-next:
    name: ${RJ_DEV_VOLUME_PREFIX:-rja-dev}-dashboard-next
