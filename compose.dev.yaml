name: real-jaen-analytics-dev

services:
  sports-data:
    build:
      context: ./sports-data
      dockerfile: Dockerfile
    image: local/real-jaen-analytics/sports-data:dev
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700
    command:
      ["-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      SPORTS_DATA_STORAGE: sql
      SPORTS_DATA_DB: /state/real-jaen.sqlite
      SPORTS_DATA_SCOPE: /app/ambito.json
      SPORTS_DATA_CONTROL: "1"
      SPORTS_DATA_ENRICHMENT_ENABLED: "1"
      SPORTS_DATA_WORKERS: "1"
      WEB_CONCURRENCY: "1"
      RJ_UPDATE_RECIPE: ${RJ_UPDATE_RECIPE:-sofascore-group2-2627-v1}
      RJ_ACQUISITION_URL: http://acquisition:8002
      RJ_ACQUISITION_SECRET_FILE: /run/secrets/acquisition-token
      RJ_CONTROL_SECRET_FILE: /run/secrets/control-token
      RJ_ACQUISITION_MAX_ATTEMPTS: "48"
      RJ_ACQUISITION_MAX_SENDS: "52"
      RJ_ACQUISITION_DETAIL_ROUNDS: ${RJ_DEV_DETAIL_ROUNDS:-10}
    volumes:
      - type: volume
        source: sports-state
        target: /state
      - type: bind
        source: ${RJ_DEV_IMPORT_DIR:?Set RJ_DEV_IMPORT_DIR to a separate copy of import files}
        target: /imports
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/control-token
        target: /run/secrets/control-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/acquisition-token
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
    networks: [sports-data-internal, acquisition-control]
    depends_on:
      acquisition:
        condition: service_healthy

  acquisition:
    build:
      context: ./acquisition
      dockerfile: Dockerfile
      target: runtime
      network: none
      additional_contexts:
        implementation: ./acquisition/src/acquisition
        backend: ./sports-data
        checks: ./acquisition/tests
      args:
        PROFILE_RUNTIME: ${RJ_SCRAPER_RUNTIME_IMAGE:?Set the separately audited browser runtime image}
    image: local/real-jaen-analytics/acquisition:dev
    init: true
    restart: unless-stopped
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./acquisition/docker/seccomp-linux-amd64.json
    shm_size: 512m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    command:
      ["acquisition.app:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1", "--no-access-log", "--reload", "--reload-dir", "/opt/app/acquisition"]
    environment:
      ACQ_PROVIDER: sofascore
      ACQ_ENABLE_REAL: ${RJ_ACQUISITION_ENABLE_REAL:?Set explicitly; starting this service does not start an acquisition}
      ACQ_SECRET_FILE: /run/secrets/acquisition-token
    volumes:
      - type: volume
        source: acquisition-profiles
        target: /profiles
      - type: volume
        source: acquisition-jobs
        target: /acquisition-jobs
      - type: bind
        source: ./acquisition/src/acquisition
        target: /opt/app/acquisition
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./sports-data/acquisition
        target: /opt/shared-backend/acquisition
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/acquisition-token
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
    networks: [acquisition-control, acquisition-egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  acquisition-admin:
    profiles: [admin]
    image: local/real-jaen-analytics/acquisition:dev
    pull_policy: never
    entrypoint: [python, -B, -m, acquisition.admin]
    init: true
    network_mode: none
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./acquisition/docker/seccomp-linux-amd64.json
    shm_size: 512m
    volumes:
      - type: volume
        source: acquisition-profiles
        target: /profiles

  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    image: local/real-jaen-analytics/video-service:dev
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    command: ["python", "-B", "-m", "uvicorn", "video_service.main:app", "--host", "0.0.0.0", "--port", "8010", "--reload", "--reload-dir", "/app/src"]
    environment:
      VIDEO_SERVICE_HOST: 0.0.0.0
      VIDEO_SERVICE_PORT: "8010"
      VIDEO_SERVICE_DATA_DIR: /app/data
      VIDEO_SERVICE_MANIFEST: videos.example.json
      VIDEO_SERVICE_STATE_DIR: /state
      VIDEO_SERVICE_TEMP_DIR: /tmp/video-service
      TMPDIR: /tmp/video-service
      DENO_DIR: /tmp/video-service/deno
    volumes:
      - type: volume
        source: video-state
        target: /state
      - type: bind
        source: ./video-service/src
        target: /app/src
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp/video-service:rw,noexec,nosuid,size=4g,uid=10001,gid=10001,mode=0700
    networks: [video-internal, video-egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    image: local/real-jaen-analytics/dashboard:dev
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      DATA_MODE: real
      LOCAL_DATA_API_URL: http://sports-data:8002
      VIDEO_SERVICE_URL: http://video-service:8010
      RJ_ACCESS_PASSWORD_FILE: /run/secrets/access-password
      RJ_SESSION_SECRET_FILE: /run/secrets/session/session-secret
      RJ_CONTROL_SECRET_FILE: /run/secrets/control-token
    volumes:
      - type: bind
        source: ./dashboard/src
        target: /app/src
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./dashboard/public
        target: /app/public
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./dashboard/data/synthetic
        target: /app/data/synthetic
        read_only: true
        bind: {create_host_path: false}
      - type: volume
        source: dashboard-next
        target: /app/.next
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/access-password
        target: /run/secrets/access-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/session
        target: /run/secrets/session
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_DEV_SECRET_DIR:?Set RJ_DEV_SECRET_DIR outside this repository}/control-token
        target: /run/secrets/control-token
        read_only: true
        bind: {create_host_path: false}
    ports:
      - "127.0.0.1:${RJ_DEV_DASHBOARD_PORT:-3201}:3000"
    networks: [dashboard-edge, sports-data-internal, video-internal]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/session').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      sports-data:
        condition: service_healthy
      acquisition:
        condition: service_healthy
      video-service:
        condition: service_healthy

networks:
  dashboard-edge:
    name: rja-dev-dashboard-edge
  sports-data-internal:
    name: rja-dev-sports-data-internal
    internal: true
  video-internal:
    name: rja-dev-video-internal
    internal: true
  acquisition-control:
    name: rja-dev-acquisition-control
    internal: true
  acquisition-egress:
    name: rja-dev-acquisition-egress
  video-egress:
    name: rja-dev-video-egress

volumes:
  sports-state:
    name: rja-dev-sports-state
  acquisition-profiles:
    name: rja-dev-acquisition-profiles
  acquisition-jobs:
    name: rja-dev-acquisition-jobs
  video-state:
    name: rja-dev-video-state
  dashboard-next:
    name: rja-dev-dashboard-next
