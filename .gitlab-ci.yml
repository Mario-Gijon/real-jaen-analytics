stages:
  - deploy

.deploy_sinbad2:
  stage: deploy
  environment:
    name: production
  resource_group: sinbad2-production
  interruptible: false
  allow_failure: false

deploy_to_sinbad2:
  extends: .deploy_sinbad2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  script:
    - bash scripts/deploy-sinbad2.sh deploy
