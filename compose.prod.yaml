name: ${COMPOSE_PROJECT_NAME:-real-jaen-analytics-prod}

services:
  sports-data:
    build:
      context: ./sports-data
      dockerfile: Dockerfile
    image: local/real-jaen-analytics/sports-data:prod
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700
    environment:
      SPORTS_DATA_STORAGE: sql
      SPORTS_DATA_DB: /state/real-jaen.sqlite
      SPORTS_DATA_SCOPE: /app/ambito.json
      SPORTS_DATA_CONTROL: "1"
      SPORTS_DATA_ENRICHMENT_ENABLED: "1"
      SPORTS_DATA_WORKERS: "1"
      WEB_CONCURRENCY: "1"
      RJ_UPDATE_RECIPE: sofascore-group2-2627-v1
      RJ_ACQUISITION_URL: http://acquisition:8002
      RJ_ACQUISITION_SECRET_FILE: /run/secrets/acquisition-token
      RJ_CONTROL_SECRET_FILE: /run/secrets/control-token
      RJ_ACQUISITION_MAX_ATTEMPTS: "48"
      RJ_ACQUISITION_MAX_SENDS: "52"
      RJ_UPDATE_RECENT_ROUNDS: "3"
      RJ_UPDATE_MAX_TOTAL_SENDS: "50"
    volumes:
      - type: volume
        source: sports-state
        target: /state
      - type: bind
        source: ${RJ_IMPORT_DIR:?Set the external read-only import directory}
        target: /imports
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_PROD_SECRET_DIR:?Set RJ_PROD_SECRET_DIR outside this repository}/control-token
        target: /run/secrets/control-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_PROD_SECRET_DIR:?Set RJ_PROD_SECRET_DIR outside this repository}/acquisition-token
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
    networks: [sports-data-internal, acquisition-control]
  acquisition:
    build:
      context: ./acquisition
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        implementation: ./acquisition/src/acquisition
        backend: ./sports-data
        checks: ./acquisition/tests
    image: local/real-jaen-analytics/acquisition:prod
    init: true
    restart: unless-stopped
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./acquisition/docker/seccomp-linux-amd64.json
    shm_size: 512m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      ACQ_PROVIDER: sofascore
      ACQ_ENABLE_REAL: ${RJ_ACQUISITION_ENABLE_REAL:-0}
      ACQ_MAX_ATTEMPTS: "48"
      ACQ_MAX_SENDS: "52"
      ACQ_UPDATE_RECENT_ROUNDS: "3"
      ACQ_UPDATE_MAX_TOTAL_SENDS: "50"
      ACQ_SECRET_FILE: /run/secrets/acquisition-token
    volumes:
      - type: volume
        source: acquisition-profiles
        target: /profiles
      - type: volume
        source: acquisition-jobs
        target: /acquisition-jobs
      - type: bind
        source: ${RJ_PROD_SECRET_DIR:?Set RJ_PROD_SECRET_DIR outside this repository}/acquisition-token
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
    networks: [acquisition-control, acquisition-egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    image: local/real-jaen-analytics/video-service:prod
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    environment:
      VIDEO_SERVICE_HOST: 0.0.0.0
      VIDEO_SERVICE_PORT: "8010"
      VIDEO_SERVICE_DATA_DIR: /app/data
      VIDEO_SERVICE_MANIFEST: ${RJ_VIDEO_MANIFEST:-videos.json}
      VIDEO_SERVICE_STATE_DIR: /state
      VIDEO_SERVICE_TEMP_DIR: /tmp/video-service
      TMPDIR: /tmp/video-service
      DENO_DIR: /tmp/video-service/deno
    volumes:
      - type: volume
        source: video-state
        target: /state
      - type: bind
        source: ${RJ_VIDEO_CATALOG_DIR:?Set an external video catalog directory outside this repository}
        target: /app/data
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp/video-service:rw,noexec,nosuid,size=4g,uid=10001,gid=10001,mode=0700
    networks: [video-internal, video-egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: local/real-jaen-analytics/dashboard:prod
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      DATA_MODE: real
      LOCAL_DATA_API_URL: http://sports-data:8002
      VIDEO_SERVICE_URL: http://video-service:8010
      RJ_ACCESS_PASSWORD_FILE: /run/secrets/access-password
      RJ_UPDATE_PASSWORD_FILE: /run/secrets/update-password
      RJ_SESSION_SECRET_FILE: /run/secrets/session/session-secret
      RJ_CONTROL_SECRET_FILE: /run/secrets/control-token
      RJ_TRUSTED_CLIENT_IP_HEADER: ${RJ_TRUSTED_CLIENT_IP_HEADER:-}
    volumes:
      - type: bind
        source: ${RJ_PROD_SECRET_DIR:?Set RJ_PROD_SECRET_DIR outside this repository}/access-password
        target: /run/secrets/access-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_PROD_SECRET_DIR:?Set RJ_PROD_SECRET_DIR outside this repository}/update-password
        target: /run/secrets/update-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_PROD_SECRET_DIR:?Set RJ_PROD_SECRET_DIR outside this repository}/session
        target: /run/secrets/session
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_PROD_SECRET_DIR:?Set RJ_PROD_SECRET_DIR outside this repository}/control-token
        target: /run/secrets/control-token
        read_only: true
        bind: {create_host_path: false}
    ports:
      - "${RJ_DASHBOARD_BIND:-127.0.0.1}:${RJ_DASHBOARD_PORT:-8120}:3000"
    networks: [dashboard-edge, sports-data-internal, video-internal]
    depends_on:
      sports-data:
        condition: service_healthy
      video-service:
        condition: service_healthy

networks:
  dashboard-edge:
    name: ${RJ_PROD_NETWORK_PREFIX:-rja-prod}-dashboard-edge
  sports-data-internal:
    name: ${RJ_PROD_NETWORK_PREFIX:-rja-prod}-sports-data-internal
    internal: true
  video-internal:
    name: ${RJ_PROD_NETWORK_PREFIX:-rja-prod}-video-internal
    internal: true
  acquisition-control:
    name: ${RJ_PROD_NETWORK_PREFIX:-rja-prod}-acquisition-control
    internal: true
  acquisition-egress:
    name: ${RJ_PROD_NETWORK_PREFIX:-rja-prod}-acquisition-egress
  video-egress:
    name: ${RJ_PROD_NETWORK_PREFIX:-rja-prod}-video-egress

volumes:
  sports-state:
    name: ${RJ_PROD_SPORTS_STATE_VOLUME:-rja-prod-sports-state}
  acquisition-profiles:
    name: ${RJ_PROD_ACQUISITION_PROFILES_VOLUME:-rja-prod-acquisition-profiles}
  acquisition-jobs:
    name: ${RJ_PROD_ACQUISITION_JOBS_VOLUME:-rja-prod-acquisition-jobs}
  video-state:
    name: ${RJ_PROD_VIDEO_STATE_VOLUME:-rja-prod-video-state}
